# Render Blueprint: New > Blueprint > pick this repo, Render reads this file.
services:
  - type: web
    name: medvision-ai
    runtime: python
    plan: free
    # CPU-only torch first: the default Linux wheel bundles ~2.5 GB of CUDA libraries
    buildCommand: >-
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEVICE
        value: cpu
